<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title description">
  <title id="title">RoadPulse Ghana — Journey Tracking Sequence Diagram</title>
  <desc id="description">A sequence diagram for a driver starting and stopping a journey tracking session with GPS collection and backend synchronization.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="open-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8" fill="none" stroke="#64748B" stroke-width="1.5"/>
    </marker>
    <style>
      .page { fill: #F8FAFC; }
      .title { font: 800 30px Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #64748B; }
      .actor { fill: #FFFFFF; stroke: #94A3B8; stroke-width: 1.5; rx: 14; ry: 14; }
      .actor-title { font: 800 14px Arial, sans-serif; fill: #0F172A; }
      .lifeline { stroke: #CBD5E1; stroke-width: 1.3; stroke-dasharray: 6 6; }
      .activation { fill: #DBEAFE; stroke: #60A5FA; stroke-width: 1; }
      .message { fill: none; stroke: #475569; stroke-width: 1.7; marker-end: url(#arrow); }
      .return { fill: none; stroke: #64748B; stroke-width: 1.4; stroke-dasharray: 5 4; marker-end: url(#open-arrow); }
      .message-text { font: 600 12px Arial, sans-serif; fill: #334155; }
      .note { fill: #FFFBEB; stroke: #FCD34D; stroke-width: 1; rx: 10; ry: 10; }
      .note-text { font: 500 11px Arial, sans-serif; fill: #854D0E; }
      .phase { fill: #EFF6FF; stroke: #BFDBFE; stroke-width: 1; rx: 10; ry: 10; }
      .phase-text { font: 800 11px Arial, sans-serif; letter-spacing: 1px; fill: #2563EB; }
      .alt { fill: none; stroke: #CBD5E1; stroke-width: 1.2; stroke-dasharray: 5 4; rx: 12; ry: 12; }
      .alt-label { font: 800 11px Arial, sans-serif; fill: #64748B; }
    </style>
  </defs>

  <rect class="page" width="1400" height="980"/>
  <text class="title" x="60" y="60">RoadPulse Ghana — Journey Tracking Sequence</text>
  <text class="subtitle" x="60" y="88">Driver starts a trip, accepted GPS points are synchronized, then the trip is completed</text>

  <rect class="actor" x="75" y="125" width="150" height="50"/>
  <text class="actor-title" x="118" y="156">Driver</text>
  <rect class="actor" x="300" y="125" width="180" height="50"/>
  <text class="actor-title" x="327" y="156">Tracking Screen</text>
  <rect class="actor" x="555" y="125" width="190" height="50"/>
  <text class="actor-title" x="578" y="156">Tracking Hook</text>
  <rect class="actor" x="815" y="125" width="180" height="50"/>
  <text class="actor-title" x="842" y="156">Expo Location</text>
  <rect class="actor" x="1065" y="125" width="190" height="50"/>
  <text class="actor-title" x="1099" y="156">Backend API</text>

  <line class="lifeline" x1="150" y1="175" x2="150" y2="930"/>
  <line class="lifeline" x1="390" y1="175" x2="390" y2="930"/>
  <line class="lifeline" x1="650" y1="175" x2="650" y2="930"/>
  <line class="lifeline" x1="905" y1="175" x2="905" y2="930"/>
  <line class="lifeline" x1="1160" y1="175" x2="1160" y2="930"/>

  <rect class="phase" x="75" y="205" width="1180" height="31"/>
  <text class="phase-text" x="95" y="226">START TRACKING</text>

  <path class="message" d="M150 270 H390"/>
  <text class="message-text" x="205" y="261">Tap “Start tracking”</text>
  <rect class="activation" x="382" y="270" width="16" height="55"/>
  <path class="message" d="M390 300 H650"/>
  <text class="message-text" x="442" y="291">startTracking()</text>
  <rect class="activation" x="642" y="300" width="16" height="195"/>

  <path class="message" d="M650 335 H905"/>
  <text class="message-text" x="695" y="326">Request high-accuracy initial fix</text>
  <rect class="activation" x="897" y="335" width="16" height="50"/>
  <path class="return" d="M905 385 H650"/>
  <text class="message-text" x="708" y="377">Location + accuracy</text>

  <path class="message" d="M650 425 H1160"/>
  <text class="message-text" x="778" y="416">POST /tracking/sessions</text>
  <rect class="activation" x="1152" y="425" width="16" height="55"/>
  <path class="return" d="M1160 480 H650"/>
  <text class="message-text" x="820" y="472">Active session</text>

  <path class="message" d="M650 520 H905"/>
  <text class="message-text" x="705" y="511">Subscribe to foreground updates</text>
  <path class="return" d="M905 550 H650"/>
  <text class="message-text" x="690" y="542">Subscription active</text>
  <path class="return" d="M650 580 H390"/>
  <text class="message-text" x="448" y="572">Show active drive UI</text>

  <rect class="note" x="470" y="602" width="360" height="47"/>
  <text class="note-text" x="488" y="622">Points are accepted only with ≤30m reported accuracy.</text>
  <text class="note-text" x="488" y="639">Stationary GPS drift is filtered before distance is added.</text>

  <rect class="phase" x="75" y="675" width="1180" height="31"/>
  <text class="phase-text" x="95" y="696">COLLECT &amp; SYNC WHILE DRIVING</text>

  <rect class="alt" x="570" y="728" width="615" height="110"/>
  <text class="alt-label" x="586" y="747">loop · native GPS update (about every 7 seconds / 5m, platform dependent)</text>
  <path class="message" d="M905 770 H650"/>
  <text class="message-text" x="700" y="761">Location update</text>
  <path class="message" d="M650 803 H1160"/>
  <text class="message-text" x="807" y="794">POST /tracking/sessions/:id/points</text>
  <path class="return" d="M1160 827 H650"/>
  <text class="message-text" x="831" y="819">Accepted point IDs</text>

  <rect class="phase" x="75" y="860" width="1180" height="31"/>
  <text class="phase-text" x="95" y="881">STOP TRACKING · Flush remaining points · POST /tracking/sessions/:id/complete</text>

  <text class="subtitle" x="60" y="950">If synchronization fails while a drive is active, unsent points remain in the local outbox until they can be retried.</text>
</svg>
